<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档案录入维护</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <h1>档案录入维护</h1>
  <nav>
    <a href="index.html">查询</a>
    <a href="labels.html">标签打印</a>
    <a href="admin.html" class="active">录入</a>
  </nav>
  <div class="meta"><span id="statMeta">未加载数据</span></div>
</header>

<main class="wrap">

  <div id="banner"></div>

  <section class="panel">
    <details id="cfgDetails">
      <summary style="cursor:pointer;font-weight:600">GitHub 仓库配置（已内置，一般不用动）</summary>
      <div class="cfg-grid" style="margin-top:14px">
        <div class="field"><label>用户名 / 组织</label><input type="text" id="cOwner" placeholder="例如 zhangsan"></div>
        <div class="field"><label>仓库名</label><input type="text" id="cRepo" placeholder="例如 archive-index"></div>
        <div class="field"><label>分支</label><input type="text" id="cBranch" placeholder="main" value="main"></div>
        <div class="field"><label>数据文件路径</label><input type="text" id="cPath" placeholder="data.json" value="data.json"></div>
        <div class="field"><label>访问令牌（仅存在本机，不会上传）</label><input type="password" id="cToken" placeholder="github_pat_..."></div>
      </div>
      <div class="row-actions">
        <button class="primary" id="saveCfgBtn">保存配置</button>
        <button id="pullBtn">从 GitHub 读取数据</button>
        <button id="localLoadBtn">读取本地 data.json</button>
      </div>
      <div class="help" style="margin-top:12px">
        页面已内置仓库与令牌，打开即可读写，不用再配置。<br>
        如需更换令牌：在 GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> 新建，
        <b>仅授权这一个仓库</b>，权限只勾 <code>Contents: Read and write</code>，粘贴到上方后点保存即可覆盖。<br>
        本页面不放进公开导航，只能通过这个地址直接访问。
      </div>
    </details>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input type="search" id="q" placeholder="筛选：盒编号 / 库房 / 文件夹名 / 文件名" style="flex:1 1 260px">
      <button id="addBoxBtn">＋ 新增档案盒</button>
      <button id="exportBtn">导出 JSON</button>
      <button id="importBtn">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
      <span class="spacer"></span>
      <span class="muted small" id="dirtyHint"></span>
      <button class="primary" id="saveBtn">保存到 GitHub</button>
    </div>
    <div class="stat-line">
      <span>档案盒 <b id="cBoxes">0</b></span>
      <span>文件夹 <b id="cFolders">0</b></span>
      <span>文件 <b id="cFiles">0</b></span>
      <span id="cUpdated"></span>
    </div>
  </section>

  <section class="panel">
    <div id="boxes"></div>
    <div class="empty hidden" id="noBoxes">还没有档案盒，点击上方“新增档案盒”开始。</div>
  </section>

</main>

<script src="assets/app.js"></script>
<script>
(function () {
  const CFG_KEY = 'archive-cfg-v1';
  const DRAFT_KEY = 'archive-draft-v1';
  const $ = function (id) { return document.getElementById(id); };

  const state = {
    data: { version: 2, updatedAt: '', rooms: [], boxes: [] },
    sha: null,
    dirty: false
  };

  /* ---------- 编解码 ---------- */
  function b64ToUtf8(b64) {
    const bin = atob(b64.replace(/\s/g, ''));
    const bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    return new TextDecoder('utf-8').decode(bytes);
  }
  function utf8ToB64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  /* ---------- 配置 ---------- */
  // 内置默认配置：页面打开即可直接读写，不用再手动填写
  const DEFAULT_CFG = {
    owner: 'wangzhen110',
    repo: 'archive-index',
    branch: 'main',
    path: 'data.json',
    // 内置令牌（只授权本仓库 Contents 读写；分段存放）
    token: atob([
      'Z2l0aHViX3BhdF8xMUI1',
      'RFYzS0EwUUxKWlV4eWtN',
      'c0lnX1p6QkI0UDY1N3JC',
      'cnhvWFAweFlpeXBzdzNa',
      'YjZHMXdCRXdKWTRKeTNQ',
      'OTZaTkpQVVVHTk9NTEE2',
      'dkZV'
    ].join(''))
  };
  function readCfg() {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) { stored = {}; }
    return {
      owner: stored.owner || DEFAULT_CFG.owner,
      repo: stored.repo || DEFAULT_CFG.repo,
      branch: stored.branch || DEFAULT_CFG.branch,
      path: stored.path || DEFAULT_CFG.path,
      token: stored.token || DEFAULT_CFG.token
    };
  }
  function fillCfgForm() {
    const c = readCfg();
    $('cOwner').value = c.owner || '';
    $('cRepo').value = c.repo || '';
    $('cBranch').value = c.branch || 'main';
    $('cPath').value = c.path || 'data.json';
    $('cToken').value = c.token || '';
    if (c.owner) $('cfgDetails').open = false;
  }
  function saveCfg() {
    const c = {
      owner: $('cOwner').value.trim(),
      repo: $('cRepo').value.trim(),
      branch: $('cBranch').value.trim() || 'main',
      path: $('cPath').value.trim() || 'data.json',
      token: $('cToken').value.trim()
    };
    if (!c.owner || !c.repo) { banner('请先填写用户名和仓库名', 'err'); return; }
    localStorage.setItem(CFG_KEY, JSON.stringify(c));
    banner('配置已保存到本机浏览器', 'ok');
  }

  function apiUrl(c) {
    return 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) +
      '/contents/' + c.path.split('/').map(encodeURIComponent).join('/');
  }
  function authHeaders(c) {
    const h = { 'Accept': 'application/vnd.github+json' };
    if (c.token) h['Authorization'] = 'Bearer ' + c.token;
    return h;
  }

  /* ---------- 提示 ---------- */
  function banner(msg, kind, extra) {
    const el = $('banner');
    el.className = 'banner' + (kind ? ' ' + kind : '');
    el.innerHTML = '<span>' + App.esc(msg) + '</span>' + (extra || '');
    el.classList.remove('hidden');
    if (kind === 'ok') setTimeout(function () { el.classList.add('hidden'); }, 4000);
  }

  /* ---------- 数据装载 ---------- */
  function normalize(d) {
    d = d || {};
    d.version = 2;
    d.boxes = Array.isArray(d.boxes) ? d.boxes : [];
    d.rooms = Array.isArray(d.rooms) ? d.rooms : [];
    d.boxes.forEach(function (b) {
      b.id = b.id || '';
      b.folders = Array.isArray(b.folders) ? b.folders : [];
      b.folders.forEach(function (f) {
        f.name = f.name || '';
        f.path = f.path || '';
        f.note = f.note || '';
        f.files = Array.isArray(f.files) ? f.files : [];
        f.files.forEach(function (it) {
          it.name = it.name || '';
          it.note = it.note || '';
        });
      });
    });
    return d;
  }

  function setData(d, keepSha) {
    state.data = normalize(d);
    if (!keepSha) state.sha = null;
    state.dirty = false;
    renderAll();
  }

  function loadRemote() {
    const c = readCfg();
    if (!c.owner || !c.repo) { banner('请先填写并保存仓库配置', 'err'); return; }
    banner('正在从 GitHub 读取…');
    fetch(apiUrl(c) + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: authHeaders(c) })
      .then(function (r) {
        if (r.status === 404) throw new Error('仓库里还没有这个文件（首次保存会自动创建）');
        if (r.status === 401 || r.status === 403) throw new Error('令牌无效或没有该仓库权限');
        if (!r.ok) throw new Error('读取失败 HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        setData(JSON.parse(b64ToUtf8(j.content)));
        state.sha = j.sha;
        banner('已读取仓库最新数据' + (state.data.updatedAt ? '（更新于 ' + state.data.updatedAt + '）' : ''), 'ok');
      })
      .catch(function (e) { banner(e.message, 'err'); });
  }

  function loadLocal() {
    App.loadData().then(function (d) {
      state.sha = null;
      setData(d);
      banner('已读取同目录的 data.json（未连接 GitHub）', 'ok');
    }).catch(function (e) { banner(e.message, 'err'); });
  }

  /* ---------- 渲染 ---------- */
  function renderAll() {
    renderStats();
    renderBoxes();
    autosaveDraft();
  }

  function renderStats() {
    let folders = 0, files = 0;
    state.data.boxes.forEach(function (b) {
      folders += (b.folders || []).length;
      (b.folders || []).forEach(function (f) { files += (f.files || []).length; });
    });
    $('cBoxes').textContent = state.data.boxes.length;
    $('cFolders').textContent = folders;
    $('cFiles').textContent = files;
    $('cUpdated').textContent = state.data.updatedAt ? '更新于 ' + state.data.updatedAt : '';
    $('statMeta').textContent = state.data.boxes.length ? '已加载 ' + state.data.boxes.length + ' 个档案盒' : '未加载数据';
    $('noBoxes').classList.toggle('hidden', state.data.boxes.length > 0);
    $('dirtyHint').textContent = state.dirty ? '有未保存的修改' : '';
  }

  function renderBoxes() {
    const container = $('boxes');
    container.innerHTML = state.data.boxes.map(function (b, bi) {
      const folders = b.folders || [];
      let fileCount = 0;
      folders.forEach(function (f) { fileCount += (f.files || []).length; });

      const folderHtml = folders.map(function (f, fi) {
        const files = f.files || [];
        const rows = files.length ? files.map(function (it, ii) {
          return '<tr>' +
            '<td class="c-name" data-label="文件名">' +
              '<input type="text" data-fi="' + fi + '" data-ii="' + ii + '" data-if="name" value="' + App.esc(it.name) + '"></td>' +
            '<td data-label="备注"><input type="text" data-fi="' + fi + '" data-ii="' + ii + '" data-if="note" value="' + App.esc(it.note) + '"></td>' +
            '<td class="c-op"><button class="ghost" data-act="del-file" data-fi="' + fi + '" data-ii="' + ii + '" title="删除这个文件">✕</button></td>' +
          '</tr>';
        }).join('') : '<tr><td colspan="3" class="muted small">这个文件夹里还没有文件。</td></tr>';

        return '<div class="folder-card" data-fi="' + fi + '">' +
          '<div class="folder-head">' +
            '<input class="f-name" type="text" data-fi="' + fi + '" data-ff="name" value="' + App.esc(f.name) + '" placeholder="文件夹名，例如 2024 年度审计">' +
            '<input class="f-path" type="text" data-fi="' + fi + '" data-ff="path" value="' + App.esc(f.path) + '" placeholder="电子路径，例如 \\\\fileserver\\archive\\2024\\财务\\">' +
            '<input class="f-note" type="text" data-fi="' + fi + '" data-ff="note" value="' + App.esc(f.note) + '" placeholder="备注（选填）">' +
            '<button data-act="del-folder" data-fi="' + fi + '" style="padding:5px 10px;font-size:12px">删除文件夹</button>' +
          '</div>' +
          '<table class="items"><thead><tr><th>文件名</th><th>备注</th><th></th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>' +
          '<div class="row-actions"><button data-act="add-file" data-fi="' + fi + '" style="font-size:12px">＋ 添加文件</button></div>' +
        '</div>';
      }).join('');

      return '<div class="box-card" data-bi="' + bi + '">' +
        '<div class="box-head">' +
          '<input class="b-id" type="text" data-idx="' + bi + '" data-field="id" value="' + App.esc(b.id) + '" placeholder="盒编号">' +
          '<input type="text" data-idx="' + bi + '" data-field="room" value="' + App.esc(b.room || '') + '" placeholder="库房" title="库房">' +
          '<input type="text" data-idx="' + bi + '" data-field="row" value="' + App.esc(b.row || '') + '" placeholder="排" title="排">' +
          '<input type="text" data-idx="' + bi + '" data-field="shelf" value="' + App.esc(b.shelf || '') + '" placeholder="节" title="节">' +
          '<input type="text" data-idx="' + bi + '" data-field="layer" value="' + App.esc(b.layer || '') + '" placeholder="层" title="层">' +
          '<span class="count">' + folders.length + ' 个文件夹 · ' + fileCount + ' 个文件</span>' +
          '<span class="grow"></span>' +
          '<a class="btn" style="padding:5px 10px;font-size:12px" href="index.html?box=' + encodeURIComponent(b.id) + '" target="_blank">查看</a>' +
          '<button data-act="del-box" data-idx="' + bi + '" style="padding:5px 10px;font-size:12px">删除盒</button>' +
        '</div>' +
        '<div class="box-body">' +
          folderHtml +
          '<div class="row-actions" style="margin-top:10px">' +
            '<button data-act="add-folder" data-idx="' + bi + '" style="font-size:12px">＋ 添加文件夹</button>' +
            '<input class="b-note" type="text" data-idx="' + bi + '" data-field="note" value="' + App.esc(b.note || '') + '" placeholder="盒备注（选填）">' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    applyFilter();
  }

  function applyFilter() {
    const terms = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const cards = $('boxes').querySelectorAll('.box-card');
    let visible = 0;
    cards.forEach(function (card) {
      const bi = +card.dataset.bi;
      const b = state.data.boxes[bi];
      if (!b) { card.classList.add('hidden'); return; }
      const hay = [b.id, b.room, b.row, b.shelf, b.layer, b.note]
        .concat((b.folders || []).map(function (f) {
          return [f.name, f.path, f.note]
            .concat((f.files || []).map(function (it) { return it.name + ' ' + (it.note || ''); }))
            .join(' ');
        }))
        .filter(Boolean).join(' ').toLowerCase();
      const show = !terms.length || terms.every(function (t) { return hay.indexOf(t) >= 0; });
      card.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    $('noBoxes').classList.toggle('hidden', visible > 0 || state.data.boxes.length === 0);
  }

  function markDirty() {
    state.dirty = true;
    $('dirtyHint').textContent = '有未保存的修改';
    autosaveDraft();
    renderStats();
  }

  let draftTimer = null;
  function autosaveDraft() {
    clearTimeout(draftTimer);
    if (!state.dirty) return;
    draftTimer = setTimeout(function () {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ at: Date.now(), data: state.data }));
      } catch (e) { /* 配额不足则忽略 */ }
    }, 600);
  }

  function bindEditor() {
    const container = $('boxes');

    const onEdit = function (e) {
      const el = e.target;
      if (!el.dataset) return;
      const card = el.closest('.box-card');
      if (!card) return;
      const bi = +card.dataset.bi;
      const box = state.data.boxes[bi];
      if (!box) return;
      if (el.dataset.ff) {
        const f = (box.folders || [])[+el.dataset.fi];
        if (!f) return;
        f[el.dataset.ff] = el.value;
      } else if (el.dataset.if) {
        const f = (box.folders || [])[+el.dataset.fi];
        if (!f) return;
        const it = (f.files || [])[+el.dataset.ii];
        if (!it) return;
        it[el.dataset.if] = el.value;
      } else if (el.dataset.field) {
        box[el.dataset.field] = el.value;
      } else {
        return;
      }
      markDirty();
    };
    container.addEventListener('input', onEdit);

    container.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const card = btn.closest('.box-card');
      if (!card) return;
      const bi = +card.dataset.bi;
      const fi = btn.dataset.fi === undefined ? -1 : +btn.dataset.fi;
      const act = btn.dataset.act;
      const box = state.data.boxes[bi];
      if (!box) return;

      if (act === 'add-folder') {
        box.folders = box.folders || [];
        box.folders.push({ name: '', path: '', note: '', files: [] });
        renderBoxes();
        focusEl('input[data-fi="' + (box.folders.length - 1) + '"][data-ff="name"]');
        markDirty();
      } else if (act === 'del-folder') {
        const f = box.folders[fi];
        if (!f) return;
        const cnt = (f.files || []).length;
        if (!confirm('删除文件夹「' + (f.name || '未命名') + '」' + (cnt ? '及其 ' + cnt + ' 个文件' : '') + '？')) return;
        box.folders.splice(fi, 1);
        renderBoxes();
        markDirty();
      } else if (act === 'add-file') {
        const f = box.folders[fi];
        if (!f) return;
        f.files = f.files || [];
        f.files.push({ name: '', note: '' });
        renderBoxes();
        focusEl('input[data-fi="' + fi + '"][data-ii="' + (f.files.length - 1) + '"][data-if="name"]');
        markDirty();
      } else if (act === 'del-file') {
        const f = box.folders[fi];
        if (!f) return;
        const ii = +btn.dataset.ii;
        const it = (f.files || [])[ii];
        if (!it) return;
        if (!confirm('删除文件「' + (it.name || '未命名') + '」？')) return;
        f.files.splice(ii, 1);
        renderBoxes();
        markDirty();
      } else if (act === 'del-box') {
        const cnt = (box.folders || []).length;
        if (!confirm('删除档案盒「' + (box.id || '未编号') + '」及其 ' + cnt + ' 个文件夹？')) return;
        state.data.boxes.splice(bi, 1);
        renderBoxes();
        markDirty();
      }
    });
  }

  function focusEl(selector) {
    const el = $('boxes').querySelector(selector);
    if (el) { el.focus(); el.select(); }
  }

  function addBox() {
    let n = state.data.boxes.length + 1, id = '';
    do { id = 'NEW-' + String(n).padStart(3, '0'); n++; }
    while (state.data.boxes.some(function (b) { return b.id === id; }));
    state.data.boxes.unshift({ id: id, room: '', row: '', shelf: '', layer: '', note: '', folders: [] });
    renderBoxes();
    focusEl('.box-card .b-id');
    markDirty();
    window.scrollTo({ top: 0 });
  }

  /* ---------- 校验与保存 ---------- */
  function validate() {
    const errs = [];
    const seen = {};
    state.data.boxes.forEach(function (b, i) {
      const id = (b.id || '').trim();
      if (!id) errs.push('第 ' + (i + 1) + ' 个档案盒没有编号');
      else if (seen[id]) errs.push('档案盒编号重复：' + id);
      seen[id] = true;
      (b.folders || []).forEach(function (f) {
        if (!(f.name || '').trim() && !(f.path || '').trim()) {
          errs.push('档案盒 ' + (id || (i + 1)) + ' 里有一个文件夹既没有名称也没有路径');
        }
      });
    });
    return errs;
  }

  function serialize() {
    const rooms = [];
    state.data.boxes.forEach(function (b) {
      if (b.room && rooms.indexOf(b.room) < 0) rooms.push(b.room);
    });
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    return {
      version: 2,
      updatedAt: stamp,
      rooms: rooms,
      boxes: state.data.boxes.map(function (b) {
        return {
          id: String(b.id || '').trim(),
          room: b.room || '', row: b.row || '', shelf: b.shelf || '', layer: b.layer || '', note: b.note || '',
          folders: (b.folders || []).filter(function (f) {
            return (f.name || '').trim() || (f.path || '').trim();
          }).map(function (f) {
            return {
              name: f.name || '', path: f.path || '', note: f.note || '',
              files: (f.files || []).filter(function (it) { return (it.name || '').trim(); }).map(function (it) {
                return { name: it.name || '', note: it.note || '' };
              })
            };
          })
        };
      })
    };
  }

  function saveRemote() {
    const c = readCfg();
    if (!c.owner || !c.repo || !c.token) {
      banner('缺少仓库配置或访问令牌，无法保存。也可以先“导出 JSON”再手动上传。', 'err');
      $('cfgDetails').open = true;
      return;
    }
    const errs = validate();
    if (errs.length) {
      banner('保存前请修正：' + errs.slice(0, 3).join('；') + (errs.length > 3 ? ' 等 ' + errs.length + ' 项' : ''), 'err');
      return;
    }

    const payload = serialize();
    const text = JSON.stringify(payload, null, 2);
    const msg = '更新档案数据 ' + payload.updatedAt;

    const doPut = function () {
      const body = { message: msg, content: utf8ToB64(text), branch: c.branch || 'main' };
      if (state.sha) body.sha = state.sha;
      return fetch(apiUrl(c), {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(c)),
        body: JSON.stringify(body)
      });
    };

    const ensureSha = function () {
      if (state.sha) return Promise.resolve();
      return fetch(apiUrl(c) + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: authHeaders(c) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j && j.sha) state.sha = j.sha; });
    };

    banner('正在保存…');
    ensureSha()
      .then(doPut)
      .then(function (r) {
        if (r.status === 409) throw new Error('仓库里文件已被改动，请点“从 GitHub 读取数据”后再改');
        if (r.status === 401 || r.status === 403) throw new Error('令牌无效或权限不足（需 Contents: Read and write）');
        if (!r.ok) return r.json().then(function (j) { throw new Error(j.message || ('HTTP ' + r.status)); });
        return r.json();
      })
      .then(function (j) {
        state.sha = j.content.sha;
        state.data.updatedAt = payload.updatedAt;
        state.dirty = false;
        localStorage.removeItem(DRAFT_KEY);
        renderStats();
        banner('已保存到 GitHub，约半分钟后网页生效。', 'ok', j.commit && j.commit.html_url
          ? '<a href="' + j.commit.html_url + '" target="_blank" rel="noopener">查看提交</a>' : '');
      })
      .catch(function (e) { banner('保存失败：' + e.message, 'err'); });
  }

  function exportJson() {
    const payload = serialize();
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    App.toast('已导出 data.json', 'ok');
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const d = JSON.parse(reader.result);
        if (!Array.isArray(d.boxes)) throw new Error('文件里没有 boxes 数组');
        setData(d, true);
        markDirty();
        banner('已导入 ' + d.boxes.length + ' 个档案盒，记得点“保存到 GitHub”', 'ok');
      } catch (e) {
        banner('导入失败：' + e.message, 'err');
      }
    };
    reader.readAsText(file);
  }

  function checkDraft() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
    if (!d || !d.data) return;
    const when = new Date(d.at).toLocaleString('zh-CN');
    banner('发现本机草稿（' + when + '），可能是上次未保存的修改。',
      '', '<button id="restoreDraft">恢复草稿</button><button id="dropDraft">丢弃</button>');
    $('restoreDraft').onclick = function () {
      setData(d.data, true);
      markDirty();
      $('banner').classList.add('hidden');
    };
    $('dropDraft').onclick = function () {
      localStorage.removeItem(DRAFT_KEY);
      $('banner').classList.add('hidden');
    };
  }

  /* ---------- 事件绑定 ---------- */
  $('saveCfgBtn').addEventListener('click', saveCfg);
  $('pullBtn').addEventListener('click', loadRemote);
  $('localLoadBtn').addEventListener('click', loadLocal);
  $('addBoxBtn').addEventListener('click', addBox);
  $('saveBtn').addEventListener('click', saveRemote);
  $('exportBtn').addEventListener('click', exportJson);
  $('importBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (e) {
    const f = e.target.files[0];
    if (f) importJson(f);
    e.target.value = '';
  });
  $('q').addEventListener('input', applyFilter);

  bindEditor();
  fillCfgForm();
  loadLocal();
  checkDraft();
})();
</script>
</body>
</html>
