<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档案存放索引</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  @media print {
    body.detail-open .topbar,
    body.detail-open #searchPanel,
    body.detail-open .detail-actions { display: none !important; }
    body { background: #fff; }
    .folder-row-body { display: block !important; }
    .caret { display: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>档案存放索引</h1>
  <nav>
    <a href="index.html" class="active">查询</a>
    <a href="labels.html">标签打印</a>
  </nav>
  <div class="meta">
    <span id="statMeta">加载中…</span>
  </div>
</header>

<main class="wrap">

  <section class="panel" id="searchPanel">
    <div class="search-row">
      <input type="search" id="q" placeholder="输入文件名，展开它所在的文件夹…" autocomplete="off">
      <button class="ghost" id="clearBtn" title="清空">清空</button>
    </div>

    <div class="filters">
      <select id="fRoom"><option value="">全部库房</option></select>
    </div>

    <div class="stat-line">
      <span>档案盒 <b id="sBoxes">0</b></span>
      <span>文件夹 <b id="sFolders">0</b></span>
      <span>文件 <b id="sItems">0</b></span>
      <span id="sShown"></span>
    </div>

    <div id="resultList"></div>
    <div class="empty hidden" id="emptyBox">没有匹配的文件或文件夹，换个关键词试试。</div>
  </section>

  <section class="panel hidden" id="detailPanel">
    <div class="detail-head">
      <div>
        <div class="muted small">档案盒</div>
        <h2 id="dCode">—</h2>
        <div class="detail-loc"><span class="big" id="dLoc">—</span></div>
        <div class="muted small" id="dNote"></div>
      </div>
      <div class="detail-actions">
        <button class="btn" id="backBtn">← 返回搜索</button>
        <a class="btn" id="dLabelLink" href="labels.html">打印此盒标签</a>
        <button class="btn primary" id="printBtn">打印盒内清单</button>
      </div>
    </div>
    <div id="detailBody"></div>
  </section>

</main>

<script src="assets/app.js"></script>
<script>
(function () {
  let DATA = null;
  let currentBox = null;

  const $ = function (id) { return document.getElementById(id); };
  const qEl = $('q');
  const filters = { room: $('fRoom') };
  const openKeys = {};

  function termsOf(s) {
    return s.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function mark(text, terms) {
    let s = App.esc(text);
    if (!terms.length) return s;
    const pattern = terms
      .map(function (t) { return App.esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
      .filter(Boolean)
      .join('|');
    if (!pattern) return s;
    try {
      return s.replace(new RegExp('(' + pattern + ')', 'gi'), '<mark>$1</mark>');
    } catch (e) {
      return s;
    }
  }

  function copyBtn(text) {
    if (!text) return '';
    return '<button class="copy-btn" data-copy="' + App.esc(text) + '">复制路径</button>';
  }

  function folderHay(box, folder) {
    return [
      folder.name, folder.path, folder.note,
      box.id, box.room, box.row, box.shelf, box.layer, box.note
    ].concat((folder.files || []).map(function (it) { return [it.name, it.note].join(' '); }))
      .filter(Boolean).join(' ').toLowerCase();
  }

  function matches(hay, terms) {
    return !terms.length || terms.every(function (t) { return hay.indexOf(t) >= 0; });
  }

  function folderRow(box, folder, terms, open) {
    const files = folder.files || [];
    const body = files.length
      ? files.map(function (it) {
          return '<div class="file-line">' +
            '<span class="file-name">' + mark(it.name || '（未命名）', terms) + '</span>' +
            (it.note ? '<span class="muted small">' + mark(it.note, terms) + '</span>' : '') +
          '</div>';
        }).join('')
      : '<div class="muted small" style="padding:10px 14px">这个文件夹里还没有文件。</div>';

    return '<div class="folder-row' + (open ? ' open' : '') + '">' +
      '<div class="folder-row-head">' +
        '<span class="caret">▸</span>' +
        '<b class="f-name">' + mark(folder.name || '（未命名文件夹）', terms) + '</b>' +
        '<span class="muted small">' + files.length + ' 个文件</span>' +
        (folder.path ? '<span class="mono small f-path">' + mark(folder.path, terms) + '</span>' + copyBtn(folder.path) : '') +
        (folder.note ? '<span class="muted small">' + mark(folder.note, terms) + '</span>' : '') +
      '</div>' +
      '<div class="folder-row-body">' + body + '</div>' +
    '</div>';
  }

  function fillFilters() {
    const rooms = new Set(DATA.rooms || []);
    (DATA.boxes || []).forEach(function (b) { if (b.room) rooms.add(b.room); });
    filters.room.innerHTML = '<option value="">全部库房</option>' +
      Array.from(rooms).filter(Boolean).sort().map(function (v) {
        return '<option value="' + App.esc(v) + '">' + App.esc(v) + '</option>';
      }).join('');
  }

  function render() {
    const terms = termsOf(qEl.value);
    const groups = (DATA.boxes || []).map(function (box) {
      if (filters.room.value && box.room !== filters.room.value) return null;
      const folders = (box.folders || []).filter(function (f) { return matches(folderHay(box, f), terms); });
      return folders.length ? { box: box, folders: folders } : null;
    }).filter(Boolean);

    let folderCount = 0, fileCount = 0;
    groups.forEach(function (g) {
      g.folders.forEach(function (f) {
        folderCount++;
        fileCount += (f.files || []).length;
      });
    });
    $('sShown').textContent = groups.length
      ? '当前显示 ' + folderCount + ' 个文件夹 / ' + fileCount + ' 个文件'
      : '';

    $('resultList').innerHTML = groups.map(function (g) {
      const box = g.box;
      const inner = g.folders.map(function (f, i) {
        const fileHit = terms.length && (f.files || []).some(function (it) {
          return terms.every(function (t) { return ((it.name || '') + ' ' + (it.note || '')).toLowerCase().indexOf(t) >= 0; });
        });
        const open = fileHit || openKeys[box.id + '|' + i];
        return folderRow(box, f, terms, open);
      }).join('');

      return '<div class="box-group' + (openKeys[box.id] === false ? ' collapsed' : '') + '">' +
        '<div class="box-group-head" data-box="' + App.esc(box.id) + '">' +
          '<span class="caret">▾</span>' +
          '<span class="chip">' + App.esc(box.id) + '</span>' +
          '<span class="box-loc">' + App.esc(App.location(box) || '（未登记位置）') + '</span>' +
          '<span class="muted small">' + g.folders.length + ' 个文件夹 / ' +
            g.folders.reduce(function (n, f) { return n + (f.files || []).length; }, 0) + ' 个文件</span>' +
          '<a class="box-open" href="?box=' + encodeURIComponent(box.id) + '">查看盒详情 →</a>' +
        '</div>' +
        '<div class="box-group-body">' + inner + '</div>' +
      '</div>';
    }).join('');

    $('emptyBox').classList.toggle('hidden', groups.length > 0);
  }

  function openBox(id, push) {
    const box = (DATA.boxes || []).find(function (b) { return b.id === id; });
    if (!box) { App.toast('找不到档案盒：' + id, 'err'); return; }
    currentBox = box;
    $('dCode').textContent = box.id;
    $('dLoc').textContent = App.location(box) || '（未登记位置）';
    $('dNote').textContent = box.note ? '备注：' + box.note : '';
    $('dLabelLink').href = 'labels.html?box=' + encodeURIComponent(box.id);

    const folders = box.folders || [];
    $('detailBody').innerHTML = folders.length
      ? folders.map(function (f) { return folderRow(box, f, [], true); }).join('')
      : '<div class="empty">这个盒还没有登记文件夹。</div>';

    $('searchPanel').classList.add('hidden');
    $('detailPanel').classList.remove('hidden');
    document.body.classList.add('detail-open');
    window.scrollTo({ top: 0 });

    if (push !== false) history.pushState({ box: box.id }, '', '?box=' + encodeURIComponent(box.id));
  }

  function closeBox(push) {
    $('detailPanel').classList.add('hidden');
    $('searchPanel').classList.remove('hidden');
    document.body.classList.remove('detail-open');
    currentBox = null;
    if (push !== false) history.pushState({}, '', 'index.html');
  }

  function fromUrl() {
    const box = new URLSearchParams(location.search).get('box');
    if (box) openBox(box, false);
  }

  function toggleFolder(head) {
    const row = head.parentElement;
    row.classList.toggle('open');
    const group = row.closest('.box-group');
    if (group) {
      const idx = Array.prototype.indexOf.call(group.querySelectorAll('.folder-row'), row);
      const key = (group.querySelector('.box-group-head').getAttribute('data-box') || '') + '|' + idx;
      openKeys[key] = row.classList.contains('open');
    }
  }

  // 折叠/展开：点文件夹标题或盒标题；复制按钮单独处理
  document.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-copy]');
    if (btn) {
      e.stopPropagation();
      const text = btn.getAttribute('data-copy');
      const done = function () { App.toast('已复制：' + text, 'ok'); };
      const fallback = function () {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (err) { App.toast('复制失败，请手动选中复制', 'err'); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else {
        fallback();
      }
      return;
    }

    const head = e.target.closest('.folder-row-head');
    if (head && !e.target.closest('a')) { toggleFolder(head); return; }

    const bhead = e.target.closest('.box-group-head');
    if (bhead && !e.target.closest('a')) {
      const group = bhead.parentElement;
      group.classList.toggle('collapsed');
      openKeys[bhead.getAttribute('data-box')] = !group.classList.contains('collapsed');
      return;
    }
  }, true);

  function init() {
    App.loadData().then(function (data) {
      DATA = data;
      const s = App.stats(data);
      $('sBoxes').textContent = s.boxes;
      $('sFolders').textContent = s.folders;
      $('sItems').textContent = s.files;
      $('statMeta').textContent = '共 ' + s.boxes + ' 盒 / ' + s.folders + ' 个文件夹 / ' +
        s.files + ' 个文件 · 更新于 ' + (data.updatedAt || '—');
      fillFilters();
      render();
      fromUrl();
    }).catch(function (err) {
      $('statMeta').textContent = '数据加载失败';
      $('emptyBox').classList.remove('hidden');
      $('emptyBox').textContent = err.message + '。请确认 data.json 与本页在同一目录。';
    });
  }

  qEl.addEventListener('input', render);
  filters.room.addEventListener('change', render);
  $('clearBtn').addEventListener('click', function () {
    qEl.value = '';
    filters.room.value = '';
    render();
    qEl.focus();
  });

  $('backBtn').addEventListener('click', function () { closeBox(); });
  $('printBtn').addEventListener('click', function () { window.print(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && currentBox) closeBox();
  });
  window.addEventListener('popstate', function () {
    const box = new URLSearchParams(location.search).get('box');
    if (box) openBox(box, false); else closeBox(false);
  });

  init();
})();
</script>
</body>
</html>
