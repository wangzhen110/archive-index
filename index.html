<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档案存放索引</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  @media print {
    body.detail-open .topbar,
    body.detail-open #searchPanel,
    body.detail-open .detail-actions { display: none !important; }
    body { background: #fff; }
  }
  .folder-block { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  .folder-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: #fafbfc; border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
  .folder-head .f-name { font-size: 14px; }
  .folder-head .f-path { color: var(--muted); word-break: break-all; }
  .folder-block table.grid { border-radius: 0 0 8px 8px; overflow: hidden; }
</style>
</head>
<body>

<header class="topbar">
  <h1>档案存放索引</h1>
  <nav>
    <a href="index.html" class="active">查询</a>
    <a href="labels.html">标签打印</a>
  </nav>
  <div class="meta">
    <span id="statMeta">加载中…</span>
  </div>
</header>

<main class="wrap">

  <section class="panel" id="searchPanel">
    <div class="search-row">
      <input type="search" id="q" placeholder="输入文件名，查它在哪个文件夹…" autocomplete="off">
      <button class="ghost" id="clearBtn" title="清空">清空</button>
    </div>

    <div class="filters">
      <select id="fRoom"><option value="">全部库房</option></select>
    </div>

    <div class="stat-line">
      <span>档案盒 <b id="sBoxes">0</b></span>
      <span>文件夹 <b id="sFolders">0</b></span>
      <span>文件 <b id="sItems">0</b></span>
      <span id="sShown"></span>
    </div>

    <div class="table-scroll">
      <table class="grid" id="resultTable">
        <thead>
          <tr>
            <th>文件名</th>
            <th>所在文件夹</th>
            <th>档案盒位置</th>
            <th>备注</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="emptyBox">没有匹配的文件，换个关键词或清空筛选试试。</div>
  </section>

  <section class="panel hidden" id="detailPanel">
    <div class="detail-head">
      <div>
        <div class="muted small">档案盒</div>
        <h2 id="dCode">—</h2>
        <div class="detail-loc"><span class="big" id="dLoc">—</span></div>
        <div class="muted small" id="dNote"></div>
      </div>
      <div class="detail-actions">
        <button class="btn" id="backBtn">← 返回搜索</button>
        <a class="btn" id="dLabelLink" href="labels.html">打印此盒标签</a>
        <button class="btn primary" id="printBtn">打印盒内清单</button>
      </div>
    </div>
    <div id="detailBody"></div>
  </section>

</main>

<script src="assets/app.js"></script>
<script>
(function () {
  let DATA = null;
  let FLAT = [];
  let currentBox = null;

  const $ = function (id) { return document.getElementById(id); };
  const qEl = $('q');
  const filters = { room: $('fRoom') };

  function termsOf(s) {
    return s.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function mark(text, terms) {
    let s = App.esc(text);
    if (!terms.length) return s;
    const pattern = terms
      .map(function (t) { return App.esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
      .filter(Boolean)
      .join('|');
    if (!pattern) return s;
    try {
      return s.replace(new RegExp('(' + pattern + ')', 'gi'), '<mark>$1</mark>');
    } catch (e) {
      return s;
    }
  }

  function folderCell(folder, terms) {
    const name = folder.name || '（未命名文件夹）';
    const path = folder.path || '';
    return '<div><b>' + mark(name, terms) + '</b></div>' +
      (path ? '<div class="mono small muted path-text">' + mark(path, terms) + '</div>' : '');
  }

  function copyBtn(text, label) {
    if (!text) return '';
    return '<button class="copy-btn" data-copy="' + App.esc(text) + '">' + (label || '复制') + '</button>';
  }

  function buildIndex() {
    FLAT = [];
    (DATA.boxes || []).forEach(function (box) {
      (box.folders || []).forEach(function (folder) {
        const files = folder.files && folder.files.length ? folder.files : [null];
        files.forEach(function (file) {
          FLAT.push({ box: box, folder: folder, file: file, hay: '' });
        });
      });
    });
    FLAT.forEach(function (e) {
      const b = e.box, f = e.folder, it = e.file || {};
      e.hay = [
        it.name, it.note,
        f.name, f.path, f.note,
        b.id, b.room, b.row, b.shelf, b.layer, b.note
      ].filter(Boolean).join(' ').toLowerCase();
    });
  }

  function fillFilters() {
    const rooms = new Set(DATA.rooms || []);
    (DATA.boxes || []).forEach(function (b) { if (b.room) rooms.add(b.room); });
    filters.room.innerHTML = '<option value="">全部库房</option>' +
      Array.from(rooms).filter(Boolean).sort().map(function (v) {
        return '<option value="' + App.esc(v) + '">' + App.esc(v) + '</option>';
      }).join('');
  }

  function render() {
    const terms = termsOf(qEl.value);
    const rows = FLAT.filter(function (e) {
      if (terms.length && !terms.every(function (t) { return e.hay.indexOf(t) >= 0; })) return false;
      if (filters.room.value && e.box.room !== filters.room.value) return false;
      return true;
    });

    $('sShown').textContent = rows.length ? '当前显示 ' + rows.length + ' 个文件' : '';

    const LIMIT = 300;
    const html = rows.slice(0, LIMIT).map(function (e) {
      const b = e.box, f = e.folder, it = e.file || {};
      return '<tr data-box="' + App.esc(b.id) + '">' +
        '<td data-label="文件名"><span class="file-name">' + mark(it.name || '（未命名）', terms) + '</span></td>' +
        '<td data-label="所在文件夹">' + folderCell(f, terms) + '</td>' +
        '<td data-label="档案盒">' +
          '<span class="chip">' + mark(b.id, terms) + '</span> ' +
          '<span class="loc-inline">' + mark(App.location(b), terms) + '</span>' +
        '</td>' +
        '<td data-label="备注" class="small muted">' + mark(it.note || '', terms) + '</td>' +
      '</tr>';
    }).join('');

    $('resultBody').innerHTML = html || '';
    $('emptyBox').classList.toggle('hidden', rows.length > 0);
    if (rows.length > LIMIT) {
      $('resultBody').innerHTML += '<tr><td colspan="4" class="muted small">仅显示前 ' + LIMIT +
        ' 条，共 ' + rows.length + ' 条，请补充关键词缩小范围。</td></tr>';
    }

    if (currentBox) openBox(currentBox.id, false);
  }

  function copyOf(path) {
    return path ? '<button class="copy-btn" data-copy="' + App.esc(path) + '">复制路径</button>' : '';
  }

  function openBox(id, push) {
    const box = (DATA.boxes || []).find(function (b) { return b.id === id; });
    if (!box) { App.toast('找不到档案盒：' + id, 'err'); return; }
    currentBox = box;
    $('dCode').textContent = box.id;
    $('dLoc').textContent = App.location(box) || '（未登记位置）';
    $('dNote').textContent = box.note ? '备注：' + box.note : '';
    $('dLabelLink').href = 'labels.html?box=' + encodeURIComponent(box.id);

    const folders = box.folders || [];
    $('detailBody').innerHTML = folders.length ? folders.map(function (f) {
      const files = f.files || [];
      const rows = files.length ? files.map(function (it) {
        return '<tr>' +
          '<td data-label="文件名"><span class="file-name">' + App.esc(it.name || '（未命名）') + '</span></td>' +
          '<td data-label="备注" class="small muted">' + App.esc(it.note || '') + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="2" class="muted small">这个文件夹里还没有文件。</td></tr>';
      return '<div class="folder-block">' +
        '<div class="folder-head">' +
          '<span class="chip">文件夹</span>' +
          '<b class="f-name">' + App.esc(f.name || '（未命名文件夹）') + '</b>' +
          (f.path ? '<span class="mono small f-path">' + App.esc(f.path) + '</span>' + copyOf(f.path) : '') +
          (f.note ? '<span class="muted small">' + App.esc(f.note) + '</span>' : '') +
        '</div>' +
        '<table class="grid files"><tbody>' + rows + '</tbody></table>' +
      '</div>';
    }).join('') : '<div class="empty">这个盒还没有登记文件夹。</div>';

    $('searchPanel').classList.add('hidden');
    $('detailPanel').classList.remove('hidden');
    document.body.classList.add('detail-open');
    window.scrollTo({ top: 0 });

    if (push !== false) {
      history.pushState({ box: box.id }, '', '?box=' + encodeURIComponent(box.id));
    }
  }

  function closeBox(push) {
    $('detailPanel').classList.add('hidden');
    $('searchPanel').classList.remove('hidden');
    document.body.classList.remove('detail-open');
    currentBox = null;
    if (push !== false) history.pushState({}, '', 'index.html');
  }

  function fromUrl() {
    const box = new URLSearchParams(location.search).get('box');
    if (box) openBox(box, false);
  }

  // 复制按钮：捕获阶段拦截，避免触发整行点击
  document.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    e.stopPropagation();
    e.preventDefault();
    const text = btn.getAttribute('data-copy');
    const done = function () { App.toast('已复制：' + text, 'ok'); };
    const fallback = function () {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { App.toast('复制失败，请手动选中复制', 'err'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  }, true);

  function init() {
    App.loadData().then(function (data) {
      DATA = data;
      const s = App.stats(data);
      $('sBoxes').textContent = s.boxes;
      $('sFolders').textContent = s.folders;
      $('sItems').textContent = s.files;
      $('statMeta').textContent = '共 ' + s.boxes + ' 盒 / ' + s.folders + ' 个文件夹 / ' +
        s.files + ' 个文件 · 更新于 ' + (data.updatedAt || '—');
      buildIndex();
      fillFilters();
      render();
      fromUrl();
    }).catch(function (err) {
      $('statMeta').textContent = '数据加载失败';
      $('emptyBox').classList.remove('hidden');
      $('emptyBox').textContent = err.message + '。请确认 data.json 与本页在同一目录。';
    });
  }

  qEl.addEventListener('input', render);
  filters.room.addEventListener('change', render);
  $('clearBtn').addEventListener('click', function () {
    qEl.value = '';
    filters.room.value = '';
    render();
    qEl.focus();
  });

  $('resultBody').addEventListener('click', function (e) {
    const tr = e.target.closest('tr[data-box]');
    if (tr) openBox(tr.getAttribute('data-box'));
  });

  $('backBtn').addEventListener('click', function () { closeBox(); });
  $('printBtn').addEventListener('click', function () { window.print(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && currentBox) closeBox();
  });
  window.addEventListener('popstate', function () {
    const box = new URLSearchParams(location.search).get('box');
    if (box) openBox(box, false); else closeBox(false);
  });

  init();
})();
</script>
</body>
</html>
